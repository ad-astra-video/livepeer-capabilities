services:
### webserver ###
  webserver:
    image: caddy:latest
    container_name: capabilities-webserver
    ports:
      - 8088:8088
    volumes:
      - ./webserver/Caddyfile:/etc/caddy/Caddyfile
      - ./webapp/dist:/var/www/html/app
    environment:
      - HOST=${HOST}
    depends_on:
      - backend

### webapp ###
  webapp:
    image: node:20
    container_name: capabilities-webapp
    working_dir: /webapp
    volumes:
      - ./webapp:/webapp
    ports:
      - 3001:3001
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"

### backend ###
  backend:
    build: ./backend
    container_name: capabilities-backend
    ports:
      - 8000:8000
    volumes:
      - ./data/admin:/data
      - ./data/wallets:/data/wallets
      - ./backend/startup.sh:/app/startup.sh:ro
      - ./worker/agent.py:/app/agent.py:ro
      - ./webapp/dist:/app/static:ro
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN}
      - DATABASE_PATH=/data/admin.db
      - VULTR_API_KEY=${VULTR_API_KEY}
      - MAIN_SERVER_URL=${MAIN_SERVER_URL:-http://localhost:8088}
      - ARB_ETH_URL=${ARB_ETH_URL:-https://arb1.arbitrum.io/rpc}
      - WALLET_POOL_DIR=/data/wallets
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-livepeer-wallets}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_URL_EXPIRY_SECONDS=${S3_URL_EXPIRY_SECONDS:-600}

networks:
  default:
    name: livepeer-network-capabilities
